name: Anyfin
description: 'Anyfin is a Swedish consumer-fintech company that helps people lower the cost of their existing
  debt. Through its mobile app, customers photograph or import a current loan, credit card, or installment
  plan and Anyfin offers to refinance and consolidate it at a lower interest rate into a single monthly
  payment. Products span personal loans, credit-card and installment refinancing, car loans, debt consolidation,
  credit-score checking (via UC) and optional payment-protection insurance (via AXA). Founded in 2018 and
  backed by Accel, EQT Ventures and Northzone, Anyfin operates primarily in the Swedish market. It exposes
  no public developer API or developer portal; its api.anyf.in backend serves the consumer app only.'
